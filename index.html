<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منبه الدروس الذكي ⏰</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; color: #333;
        }
        .container {
            background: rgba(255, 255, 255, 0.98);
            padding: 25px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%; max-width: 420px; text-align: center;
        }
        h2 { color: #1e3c72; margin-bottom: 20px; font-size: 24px; }
        label { display: block; text-align: right; font-weight: bold; margin: 10px 0 5px; color: #444; }
        input[type="text"], select, input[type="time"] {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 2px solid #ddd; outline: none; font-size: 15px; margin-bottom: 10px;
        }
        .checkbox-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: right; margin-bottom: 15px;
        }
        .checkbox-item {
            background: #eef2f3; padding: 10px; border-radius: 10px;
            display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; cursor: pointer;
        }
        .checkbox-item input { accent-color: #1e3c72; transform: scale(1.2); }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 8px;
        }
        .btn-primary { background: #ff512f; color: white; box-shadow: 0 4px 12px rgba(255,81,47,0.4); }
        .btn-secondary { background: #e0e7ff; color: #1e3c72; }
        
        .card {
            background: #f8f9fa; border-right: 6px solid #ff512f; border-radius: 12px;
            padding: 15px; margin-bottom: 12px; text-align: right;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .card h3 { margin: 0 0 8px; color: #1e3c72; font-size: 18px; }
        .card p { margin: 4px 0; color: #555; font-size: 14px; }
        .card-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-sm { padding: 6px 12px; border-radius: 6px; font-size: 12px; border: none; cursor: pointer; }
        .btn-edit { background: #ffb703; color: white; }
        .btn-delete { background: #e63946; color: white; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- صوت المنبه المضمن بداخل الكود -->
    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- شاشة الإدخال -->
    <div id="formScreen">
        <h2>⏰ منبه الدروس الذكي</h2>
        
        <label>اسم الدرس والمدرس:</label>
        <input type="text" id="lessonName" placeholder="مثال: عربي - مستر محمد">

        <label>اليوم:</label>
        <select id="lessonDay">
            <option value="6">السبت</option>
            <option value="0">الأحد</option>
            <option value="1">الإثنين</option>
            <option value="2">الثلاثاء</option>
            <option value="3">الأربعاء</option>
            <option value="4">الخميس</option>
            <option value="5">الجمعة</option>
        </select>

        <label>الوقت (الساعة):</label>
        <input type="time" id="lessonTime">

        <label>مواعيد التنبيهات (اختر ما تريد):</label>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" class="alarm-opt" value="120"> قبليها بساعتين</label>
            <label class="checkbox-item"><input type="checkbox" class="alarm-opt" value="60"> قبليها بساعة</label>
            <label class="checkbox-item"><input type="checkbox" class="alarm-opt" value="30"> قبليها بنصف ساعة</label>
            <label class="checkbox-item"><input type="checkbox" class="alarm-opt" value="15"> قبليها بـ 15 دقيقة</label>
        </div>

        <button class="btn btn-primary" onclick="enableAudioAndSave()">حفظ المنبه 🚀</button>
        <button class="btn btn-secondary" onclick="showScreen('listScreen')">عرض الدروس المحفوظة 📚</button>
    </div>

    <!-- شاشة الدروس -->
    <div id="listScreen" class="hidden">
        <h2>📚 الدروس المحفوظة</h2>
        <div id="lessonsList"></div>
        <button class="btn btn-secondary" onclick="showScreen('formScreen')">➕ إضافة درس جديد</button>
    </div>
</div>

<script>
    let lessons = JSON.parse(localStorage.getItem('myLessons')) || [];
    let editIndex = -1;
    const daysNames = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    // تفعيل الصوت عند أول ضغطة زِر ليقبل الهاتف تشغيله أوتوماتيكياً
    function enableAudioAndSave() {
        const audio = document.getElementById('alarmSound');
        audio.play().then(() => {
            audio.pause();
            audio.currentTime = 0;
            saveLesson();
        }).catch(() => {
            saveLesson();
        });
    }

    function showScreen(screenId) {
        document.getElementById('formScreen').classList.add('hidden');
        document.getElementById('listScreen').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');
        if(screenId === 'listScreen') renderLessons();
    }

    function saveLesson() {
        const name = document.getElementById('lessonName').value;
        const day = document.getElementById('lessonDay').value;
        const time = document.getElementById('lessonTime').value;
        
        const selectedAlarms = [];
        document.querySelectorAll('.alarm-opt:checked').forEach(cb => selectedAlarms.push(cb.value));

        if (!name || !time || selectedAlarms.length === 0) {
            alert('برجاء كتابة اسم الدرس وتحديد الوقت واختيار تنبيه واحد على الأقل!');
            return;
        }

        const lessonData = { name, day, time, alarms: selectedAlarms };

        if (editIndex === -1) {
            lessons.push(lessonData);
        } else {
            lessons[editIndex] = lessonData;
            editIndex = -1;
        }

        localStorage.setItem('myLessons', JSON.stringify(lessons));
        alert('تم حفظ الدرس والمنبه بنجاح! 🎉');
        resetForm();
        showScreen('listScreen');
    }

    function renderLessons() {
        const container = document.getElementById('lessonsList');
        container.innerHTML = '';
        if (lessons.length === 0) {
            container.innerHTML = '<p style="color:#888;">لا توجد دروس محفوظة حالياً.</p>';
            return;
        }

        lessons.forEach((item, index) => {
            const alarmsText = item.alarms.map(a => a >= 60 ? (a/60) + ' ساعة' : a + ' دقيقة').join('، ');
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>📖 ${item.name}</h3>
                <p>📅 اليوم: <strong>${daysNames[item.day]} (يتكرر أسبوعياً)</strong></p>
                <p>⏰ الساعة: <strong>${item.time}</strong></p>
                <p>🔔 التنبيهات قبلها بـ: ${alarmsText}</p>
                <div class="card-actions">
                    <button class="btn-sm btn-edit" onclick="editLesson(${index})">تعديل ✏️</button>
                    <button class="btn-sm btn-delete" onclick="deleteLesson(${index})">حذف 🗑️</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function deleteLesson(index) {
        if (confirm('هل تريد حذف هذا الدرس؟')) {
            lessons.splice(index, 1);
            localStorage.setItem('myLessons', JSON.stringify(lessons));
            renderLessons();
        }
    }

    function editLesson(index) {
        const item = lessons[index];
        document.getElementById('lessonName').value = item.name;
        document.getElementById('lessonDay').value = item.day;
        document.getElementById('lessonTime').value = item.time;
        
        document.querySelectorAll('.alarm-opt').forEach(cb => {
            cb.checked = item.alarms.includes(cb.value);
        });

        editIndex = index;
        showScreen('formScreen');
    }

    function resetForm() {
        document.getElementById('lessonName').value = '';
        document.getElementById('lessonTime').value = '';
        document.querySelectorAll('.alarm-opt').forEach(cb => cb.checked = false);
    }

    // فحص المنبه باستمرار كل دقيقة (التكرار الأسبوعي المباشر)
    setInterval(() => {
        const now = new Date();
        const currentDay = now.getDay().toString();
        const currentHours = String(now.getHours()).padStart(2, '0');
        const currentMinutes = String(now.getMinutes()).padStart(2, '0');
        const currentTimeString = `${currentHours}:${currentMinutes}`;

        lessons.forEach(lesson => {
            if (lesson.day === currentDay) {
                lesson.alarms.forEach(minutesBefore => {
                    // حساب وقت التنبيه
                    const [h, m] = lesson.time.split(':').map(Number);
                    let alarmTime = new Date();
                    alarmTime.setHours(h);
                    alarmTime.setMinutes(m - parseInt(minutesBefore));

                    const alarmHours = String(alarmTime.getHours()).padStart(2, '0');
                    const alarmMins = String(alarmTime.getMinutes()).padStart(2, '0');
                    const alarmTimeString = `${alarmHours}:${alarmMins}`;

                    if (currentTimeString === alarmTimeString) {
                        const audio = document.getElementById('alarmSound');
                        audio.play();
                        alert(`⏰ تنبيه! ميعاد درس [${lesson.name}] اقترب (خلال ${minutesBefore} دقيقة)!`);
                    }
                });
            }
        });
    }, 30000); // يفحص كل 30 ثانية
</script>

</body>
</html>
